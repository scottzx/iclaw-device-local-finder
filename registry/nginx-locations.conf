# Nginx 反代片段 —— 设备注册中心（registry）

把下面三个 `location` 放进 `www.dreammate.work` 的 443 server 块即可。
registry 服务本身只监听 `127.0.0.1:1420`，由 nginx 对外暴露。

```nginx
    location /api/ {
        proxy_pass http://127.0.0.1:1420/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /health {
        proxy_pass http://127.0.0.1:1420/health;
    }
    location /device-registry {
        proxy_pass http://127.0.0.1:1420/;
        proxy_set_header Host $host;
    }
```

对应关系：

| 公网入口 | 后端 | 用途 |
| --- | --- | --- |
| `POST https://www.dreammate.work/api/register` | `127.0.0.1:1420/api/register` | 设备上报（脚本 `scripts/register-device.sh`） |
| `GET https://www.dreammate.work/health` | `127.0.0.1:1420/health` | 健康检查，注册脚本用它判断网络是否就绪 |
| `GET https://www.dreammate.work/device-registry?serial=xxx` | `127.0.0.1:1420/?serial=xxx` | 设备注册表页面（nginx 已去掉前缀） |

部署后用 `nginx -t && systemctl reload nginx` 生效。
